<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0906" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BistroPet" />
    <title>Bistro Pet</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/bistropet-32.png" />
    <link rel="apple-touch-icon" href="./icons/bistropet-180.png" />
    <link rel="stylesheet" href="./styles.css?v=session1-terms-accept" />
  </head>
  <body>
    <div class="app-shell onboarding-shell">
      <aside class="brand-panel">
        <img class="brand-photo" src="./bistro-pet-hero.png" alt="Akita ao lado de uma refeição premium para pet em bancada elegante" />
        <div class="brand-overlay"></div>
        <div class="brand-copy">
          <div class="mark">Bistro Pet</div>
          <div class="brand-signature">Atelier de Refeições</div>
          <p class="line">Porque amor também se demonstra<br />nos pequenos cuidados.</p>
          <div class="carousel" aria-live="polite">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </aside>

      <main class="workspace onboarding-workspace">
        <header class="topbar onboarding-topbar">
          <button class="brand-button" aria-label="Bistro Pet">
            Bistro Pet
            <span>atelier de refeições</span>
          </button>
        </header>

        <section class="screen active" id="welcome">
          <div class="welcome-grid onboarding-grid">
            <div class="onboarding-copy">
              <h1>Cuidado diário com sabor de afeto.</h1>
            </div>

            <div class="signin-panel onboarding-card">
              <p>Entrar na experiência</p>
              <label>
                Email
                <input id="authEmail" type="email" autocomplete="email" />
              </label>
              <label>
                Senha
                <input id="authPassword" type="password" autocomplete="current-password" />
              </label>
              <div class="auth-links" aria-label="Ações de acesso">
                <button type="button" id="signupButton">Cadastro</button>
                <button type="button" id="forgotPasswordButton">Esqueci minha senha</button>
              </div>
              <div class="consent-list" aria-label="Aceites obrigatórios">
                <label class="consent-option">
                  <input type="checkbox" id="acceptTerms" />
                  <span>Li e aceito os <a href="./terms.html">Termos de Uso</a></span>
                </label>
                <label class="consent-option">
                  <input type="checkbox" id="acceptPrivacy" />
                  <span>Li e aceito a <a href="./privacy.html">Política de Privacidade</a></span>
                </label>
              </div>
              <button class="primary full" type="button" id="createProfile" disabled>Criar perfil</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.3/dist/umd/supabase.min.js"></script>
    <script src="./bistropet-supabase.js"></script>
    <script src="./bistropet-storage.js"></script>
	    <script src="./bistropet-accessibility.js"></script>
    <script>
      const createProfileButton = document.getElementById("createProfile");
      const signupButton = document.getElementById("signupButton");
      const forgotPasswordButton = document.getElementById("forgotPasswordButton");
      const acceptTerms = document.getElementById("acceptTerms");
      const acceptPrivacy = document.getElementById("acceptPrivacy");
      const authEmail = document.getElementById("authEmail");
      const authPassword = document.getElementById("authPassword");
      let recoveryMode = /(?:#|[?&])type=recovery(?:&|$)/.test(window.location.href);
      let authBusy = false;

      function updateConsentState() {
        createProfileButton.disabled = !(acceptTerms.checked && acceptPrivacy.checked);
      }

      function credentials() {
        return {
          email: authEmail.value.trim(),
          password: authPassword.value
        };
      }

      function validateCredentials(requirePassword = true) {
        const value = credentials();
        if (!value.email || (requirePassword && !value.password)) {
          alert("Preencha o email e a senha.");
          return null;
        }
        return value;
      }

      function openProfileCreation() {
        if (!(acceptTerms.checked && acceptPrivacy.checked)) {
          alert("Para criar o cadastro, aceite os Termos de Uso e a Politica de Privacidade.");
          acceptTerms.focus();
          return;
        }
        window.location.href = "./session-2-pet-profile.html";
      }

      async function runAuth(action) {
        if (authBusy) return;
        authBusy = true;
        createProfileButton.disabled = true;
        signupButton.disabled = true;
        forgotPasswordButton.disabled = true;
        try {
          await action();
        } catch (error) {
          alert(error.message || "Não foi possível concluir o acesso.");
        } finally {
          authBusy = false;
          signupButton.disabled = false;
          forgotPasswordButton.disabled = false;
          updateConsentState();
        }
      }

      [acceptTerms, acceptPrivacy].forEach(input => input.addEventListener("change", updateConsentState));

      createProfileButton.addEventListener("click", () => runAuth(async () => {
        const value = validateCredentials();
        if (!value) return;
        if (recoveryMode) {
          await window.BistroPetSupabase.updatePassword(value.password);
          recoveryMode = false;
          alert("Senha atualizada.");
          return;
        }
        await window.BistroPetSupabase.signIn(value.email, value.password);
        openProfileCreation();
      }));
      signupButton.addEventListener("click", () => runAuth(async () => {
        if (!(acceptTerms.checked && acceptPrivacy.checked)) {
          alert("Para criar o cadastro, aceite os Termos de Uso e a Politica de Privacidade.");
          return;
        }
        const value = validateCredentials();
        if (!value) return;
        const acceptedAt = new Date().toISOString();
        const result = await window.BistroPetSupabase.signUp(value.email, value.password, {
          terms_accepted_at: acceptedAt,
          privacy_accepted_at: acceptedAt
        });
        if (result.session) openProfileCreation();
        else alert("Cadastro criado. Confirme seu email para entrar.");
      }));
      forgotPasswordButton.addEventListener("click", () => runAuth(async () => {
        const value = validateCredentials(false);
        if (!value) return;
        await window.BistroPetSupabase.sendPasswordRecovery(value.email);
        alert("Enviamos as instruções de recuperação para o seu email.");
      }));

      window.BistroPetSupabase.onAuthStateChange(event => {
        if (event === "PASSWORD_RECOVERY") recoveryMode = true;
      }).catch(error => alert(error.message || "Supabase indisponível."));
    </script>
    <script src="./pwa.js"></script>
  </body>
</html>
