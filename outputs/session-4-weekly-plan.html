<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#556a54" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BistrôPet" />
    <title>Bistro Pet - Plano Semanal</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/bistropet-apple-180.png" />
    <link rel="stylesheet" href="./styles.css?v=session4-weekly-plan" />
    <style>
      #weeklyPlanner .weekly-kitchen-stage { min-height: 520px; }
      #weeklyPlanner .weekly-result-card { position: relative; left: auto; right: auto; top: auto; margin: 18px 14px; }
      #weeklyPlanner .weekly-days { overflow: visible; }
      #weeklyPlanner .week-day-card { align-items: start; }
      #weeklyPlanner .week-day-details { display: grid; gap: 10px; margin-top: 10px; }
      #weeklyPlanner .week-day-details .ingredient-list,
      #weeklyPlanner .week-day-details .prep-steps { gap: 5px; }
      #weeklyPlanner .day-tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
      #weeklyPlanner .day-tab { border: 1px solid rgba(46, 51, 43, 0.13); background: rgba(255, 253, 248, 0.72); border-radius: 999px; padding: 7px 0; font-size: 11px; color: var(--sage-dark); }
      #weeklyPlanner .day-tab.active { background: #f0eadf; color: var(--ink); }
      #weeklyPlanner .selected-day-recipe { margin-top: 12px; }
      #weeklyPlanner .selected-day-recipe .week-day-card { grid-template-columns: 68px 1fr; }
      #weeklyPlanner .selected-day-recipe .week-day-card img { width: 68px; height: 58px; }
      #weeklyPlanner.is-custom-mode .weekly-controls { background: linear-gradient(180deg, rgba(255, 248, 232, 0.96), rgba(244, 224, 184, 0.82)); border-color: rgba(196, 145, 53, 0.26); }
      #weeklyPlanner.is-custom-mode .kitchen-switch[for="weeklyCustom"] { background: rgba(234, 216, 180, 0.82); color: #76551f; }
	      #weeklyPlanner .weekly-audio-actions { margin-top: 10px; }
	      #weeklyPlanner:not(.is-generated) .weekly-audio-actions { display: none; }
	      #weeklyPlanner .ingredient-list ul { grid-template-columns: minmax(0, 1fr); }
	      #weeklyPlanner .ingredient-list li { display: block; width: 100%; }
    </style>
  </head>
  <body class="session-three-body">
    <main class="meal-session bistro-generator">
      <section class="chef-pet-card">
        <img src="./session-3-chef-akita.png" alt="Akita chef do Bistro Pet" />
        <div>
          <strong>Luna</strong>
          <span>Menu preparado pelo Bistro</span>
        </div>
      </section>

      <section class="bistro-menu weekly-heading">
        <p class="meal-eyebrow">Menu Bistro</p>
        <h1>O chef vai organizar a semana da Luna.</h1>
      </section>

      <section class="weekly-planner" id="weeklyPlanner">
        <div class="weekly-controls">
          <input class="weekly-mode-input" type="radio" name="weekly-mode" id="weeklyAuto" checked />
          <input class="weekly-mode-input" type="radio" name="weekly-mode" id="weeklyCustom" />

          <div class="kitchen-switches" aria-label="Modos do plano semanal">
            <label class="kitchen-switch" for="weeklyAuto">
              <span>Modo Automático</span>
              <i aria-hidden="true"></i>
            </label>
            <label class="kitchen-switch" for="weeklyCustom">
              <span>Modo Personalizado</span>
              <i aria-hidden="true"></i>
            </label>
          </div>

          <button class="primary full create-week-plan" type="button" id="createWeekPlan">Criar plano da semana</button>
        </div>

        <div class="weekly-kitchen-stage">
          <img src="./session-3-sleeping-kitchen.png" alt="Cozinha do Bistro Pet preparando o plano semanal" />
          <div class="frosted-message weekly-empty-message">
            <span>Bistro em preparo</span>
            <p>O chef está organizando a próxima semana.</p>
          </div>

	          <div class="weekly-result-card" id="weeklyResultCard" role="region" aria-live="polite" aria-labelledby="weeklyPlanTitle">
	            <span class="recipe-note">Plano assinado pelo chef</span>
	            <h2 id="weeklyPlanTitle">Plano semanal da Luna</h2>
	            <div class="audio-actions weekly-audio-actions">
	              <button class="audio-button" id="listenWeeklyPlan" type="button" data-audio-listen aria-label="Ouvir plano semanal">🔊 Ouvir Plano</button>
	              <button class="audio-button" id="stopWeeklyAudio" type="button" data-audio-stop aria-label="Parar leitura do plano semanal" hidden>⏹️ Parar</button>
	            </div>
	            <div class="weekly-days" id="weeklyDays"></div>
          </div>
        </div>
      </section>
    </main>
	    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.3/dist/umd/supabase.min.js"></script>
	    <script src="./bistropet-supabase.js"></script>
	    <script src="./bistropet-storage.js?v=supabase-weekly-plan"></script>
	    <script src="./bistropet-accessibility.js?v=tts-weekly-selected-day"></script>
    <script>
      (async function () {
      if (!await window.BistroPetStorage.ready()) {
        window.location.replace("./index.html");
        return;
      }
      const weeklyPlanner = document.getElementById("weeklyPlanner");
      const weeklyDays = document.getElementById("weeklyDays");
      const createWeekPlanButton = document.getElementById("createWeekPlan");
      const customIngredients = [];
      const customBlockedIngredients = [];
      let currentPlan = [];
      let activeDayIndex = null;
      let activeWeeklyMode = "auto";
      const imagePreparingSrc = "./recipe-weekly-neutral-photo.png";
      const imageEndpoint = window.location.protocol === "file:" ? "" : "/api/generate-recipe-image";

      function profilePortionSize() {
        const profile = window.BistroPetStorage ? window.BistroPetStorage.getPetProfile() : {};
        const weightText = String(profile.weight || "").replace(",", ".");
        const weightMatch = weightText.match(/\d+(?:\.\d+)?/);
        const weight = weightMatch ? Number(weightMatch[0]) : 0;
        if (weight > 0 && weight <= 10) return "small";
        if (weight > 10 && weight <= 25) return "medium";
        if (weight > 25) return "large";
        const size = normalize(profile.size || "");
        if (/\b(pequeno|pequena|small)\b/.test(size)) return "small";
        if (/\b(grande|large)\b/.test(size)) return "large";
        return "medium";
      }

      function displayIngredientWithPortion(ingredient) {
        const portions = {
          small: { protein: 80, base: 50, vegetable: 40, grain: 30 },
          medium: { protein: 120, base: 75, vegetable: 60, grain: 45 },
          large: { protein: 160, base: 100, vegetable: 80, grain: 60 }
        };
        const size = profilePortionSize();
        const category = ingredientCategory(ingredient);
        const cleanIngredient = normalize(ingredient);
        const grams = category === "protein"
          ? portions[size].protein
          : /\b(arroz|quinoa|aveia|milho|racao|ração)\b/.test(cleanIngredient)
            ? portions[size].grain
            : category === "base"
              ? portions[size].base
              : portions[size].vegetable;
        return `${grams} g de ${ingredient}`;
      }

      function createDayCard(day, title, image, details, open = false) {
        const preparationSteps = String(details && details.prep || "")
          .split(/(?<=[.!?])\s+/)
          .map(step => step.trim())
          .filter(Boolean);
        const detailMarkup = details && Array.isArray(details.ingredients) ? `
          <div class="week-day-details"${open ? "" : " hidden"}>
            <div class="ingredient-list">
              <strong>Ingredientes utilizados</strong>
              <ul>${details.ingredients.map(ingredient => `<li>${displayIngredientWithPortion(ingredient)}</li>`).join("")}</ul>
            </div>
            <div class="prep-steps">
              <strong>Modo de preparo</strong>
              <div>${preparationSteps.map(step => `<p>${step}</p>`).join("")}</div>
            </div>
          </div>
        ` : "";
        return `
	          <article class="week-day-card" role="button" tabindex="0" data-expandable-day aria-expanded="${open ? "true" : "false"}" aria-label="${day}: ${title}">
            <img src="${image || imagePreparingSrc}" alt="${title}" onerror="this.onerror=null;this.src='./recipe-weekly-neutral-photo.png'" />
            <div>
              <strong>${day}</strong>
              <span>${title}</span>
              ${detailMarkup}
            </div>
          </article>
        `;
      }

      function shortDayName(day) {
        return {
          "Segunda": "Seg",
          "Terça": "Ter",
          "Quarta": "Qua",
          "Quinta": "Qui",
          "Sexta": "Sex",
          "Sábado": "Sáb",
          "Domingo": "Dom"
        }[day] || day.slice(0, 3);
      }

      const dayNames = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"];
      const allowedIngredientTerms = [
        ["frango", "Frango"],
        ["carne", "Carne"],
        ["peru", "Peru"],
        ["mandioca", "Mandioca"],
        ["aipim", "Mandioca"],
        ["macaxeira", "Mandioca"],
        ["inhame", "Inhame"],
        ["aveia", "Aveia"],
        ["pepino", "Pepino"],
        ["racao", "Ração"],
        ["arroz", "Arroz"],
        ["abobora", "Abóbora"],
        ["peixe", "Peixe"],
        ["batata doce", "Batata doce"],
        ["batata", "Batata"],
        ["cenoura", "Cenoura"],
        ["ovos", "Ovos"],
        ["ovo", "Ovos"],
        ["quinoa", "Quinoa"],
        ["chuchu", "Chuchu"],
        ["abobrinha", "Abobrinha"],
        ["vagem", "Vagem"],
        ["beterraba", "Beterraba"],
        ["couve manteiga", "Couve manteiga"],
        ["couve flor", "Couve flor"],
        ["couve", "Couve"],
        ["acelga", "Acelga"],
        ["repolho", "Repolho"],
        ["selga", "Selga"],
        ["mandioquinha", "Mandioquinha"]
      ];
      const weeklyCatalog = {
        protein: ["Carne", "Frango", "Peixe"],
        base: ["Arroz", "Mandioquinha", "Mandioca", "Batata", "Batata doce", "Quinoa", "Inhame", "Aveia"],
        vegetable: ["Abobrinha", "Chuchu", "Abóbora", "Cenoura", "Pepino", "Vagem", "Couve"]
      };

      function normalize(value) {
        return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      }

      function imageForRecipe(recipe, index) {
        return imagePreparingSrc;
      }

      function splitList(value) {
        return String(value || "").split(/[,.;\n]/).map(item => item.trim()).filter(Boolean);
      }

      function extractIngredientTerms(value) {
        const found = [];
        const cleanText = normalize(value);
        allowedIngredientTerms.forEach(([term, label]) => {
          const nestedInCompound = found.some(existing => normalize(existing).includes(term));
          if (cleanText.includes(term) && !nestedInCompound && !found.some(existing => isRestricted(label, [existing]) || isRestricted(existing, [label]))) {
            found.push(label);
          }
        });
        return found;
      }

      function cleanCustomIngredient(value) {
        return String(value || "").trim().replace(/\s+/g, " ");
      }

      function simpleWeeklyIngredient(value) {
        const item = cleanCustomIngredient(value);
        const clean = normalize(item);
        if (/\b(figado de boi|figado bovino)\b/.test(clean)) return "Fígado de boi";
        if (/\b(figado de galinha|figado de frango)\b/.test(clean)) return "Fígado de galinha";
        if (clean === "couve manteiga") return "Couve manteiga";
        if (clean === "couve flor") return "Couve flor";
        return item;
      }

      function weeklyProteinFamily(value) {
        const clean = normalize(simpleWeeklyIngredient(value));
        if (/\bpeixe\b/.test(clean)) return "peixe";
        if (/\bfrango\b/.test(clean)) return "frango";
        if (/\bcarne\b/.test(clean)) return "carne";
        return "";
      }

      function weeklyPreparedIngredientName(value) {
        return normalize(simpleWeeklyIngredient(value))
          .replace(/\b(cozido|cozida|cozidos|cozidas|desfiado|desfiada|desfiados|desfiadas)\b/g, "")
          .replace(/\be\b/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function cleanCustomIngredientList(value) {
        const clean = cleanCustomIngredient(value);
        if (!clean) return [];
        if (/[,.;\n]/.test(clean)) return splitList(clean).map(cleanCustomIngredient).filter(Boolean);
        const knownItems = extractIngredientTerms(clean);
        return knownItems.length ? knownItems : [clean];
      }

      function restrictionTerms(profile) {
        if (!window.BistroPetStorage) return [];
        return uniqueIngredients([
          ...window.BistroPetStorage.getOfficialRestrictions(),
          ...(window.BistroPetStorage.getGlobalBlockedIngredients
            ? window.BistroPetStorage.getGlobalBlockedIngredients()
            : [])
        ]);
      }

      function isRestricted(ingredient, restrictions) {
        const cleanIngredient = weeklyPreparedIngredientName(ingredient);
        return restrictions.some(item => {
          const cleanRestriction = weeklyPreparedIngredientName(item);
          if (!cleanIngredient || !cleanRestriction) return false;
          if (cleanIngredient === cleanRestriction) return true;
          return ["carne", "peixe", "frango"].includes(cleanRestriction)
            && cleanRestriction === weeklyProteinFamily(ingredient);
        });
      }

      function hasRestrictedText(value, restrictions) {
        const cleanValue = normalize(value);
        return restrictions.some(item => {
          const cleanRestriction = normalize(item);
          return cleanRestriction && cleanValue.includes(cleanRestriction);
        });
      }

      function uniqueIngredients(items) {
        return items.map(simpleWeeklyIngredient).filter(Boolean).filter((item, itemIndex, list) => {
          const cleanItem = normalize(item);
          return list.findIndex(candidate => normalize(candidate) === cleanItem) === itemIndex;
        });
      }

      function activeWeeklyRestrictions(profile) {
        return uniqueIngredients([
          ...restrictionTerms(profile || {}),
          ...customBlockedIngredients
        ]);
      }

      function ingredientCategory(ingredient) {
        const cleanIngredient = normalize(ingredient);
        if (weeklyProteinFamily(ingredient) || ["ovos", "ovo", "peru"].some(term => cleanIngredient.includes(term))) return "protein";
        if (["arroz", "racao", "ração", "mandioquinha", "mandioca", "aipim", "macaxeira", "batata doce", "batata", "quinoa", "inhame", "aveia"].some(term => cleanIngredient.includes(term))) return "base";
        if (["abobrinha", "chuchu", "abobora", "cenoura", "pepino", "vagem", "beterraba", "couve", "acelga", "repolho"].some(term => cleanIngredient.includes(term))) return "vegetable";
        return "";
      }

      function proteinFamily(ingredient) {
        return weeklyProteinFamily(ingredient) || normalize(simpleWeeklyIngredient(ingredient));
      }

      function weeklyNaturalList(items) {
        const names = uniqueIngredients(items).map(item => item.toLowerCase());
        if (names.length < 2) return names[0] || "os ingredientes";
        return `${names.slice(0, -1).join(", ")} e ${names[names.length - 1]}`;
      }

      function weeklyArticleForIngredient(item) {
        if (/\b(ovos)\b/.test(normalize(item))) return "os";
        return /\b(carne|batata|batata doce|cenoura|mandioca|mandioquinha|abobora|abobrinha|quinoa|aveia|couve|acelga|vagem)\b/.test(normalize(item)) ? "a" : "o";
      }

      function weeklyNaturalListWithArticle(items) {
        const names = uniqueIngredients(items).map(item => `${weeklyArticleForIngredient(item)} ${item.toLowerCase()}`);
        if (names.length < 2) return names[0] || "os ingredientes";
        return `${names.slice(0, -1).join(", ")} e ${names[names.length - 1]}`;
      }

      function weeklyAgreement(items, singular, plural) {
        return uniqueIngredients(items).length > 1 ? plural : singular;
      }

      function weeklyIsLeaf(ingredient) {
        return /\b(couve|couve manteiga|acelga|repolho)\b/.test(normalize(ingredient)) && !/\bcouve flor\b/.test(normalize(ingredient));
      }

      function weeklyRecipeTitle(ingredients) {
        const items = uniqueIngredients(ingredients);
        if (!items.length) return "Receita da semana";
        const [main, ...others] = items;
        return `${main.charAt(0).toUpperCase()}${main.slice(1).toLowerCase()}${others.length ? ` com ${weeklyNaturalList(others)}` : ""}`;
      }

      function generatedWeeklyProteinName(item, offset, restrictions) {
        const family = weeklyProteinFamily(item);
        const options = {
          carne: "Carne",
          peixe: "Peixe",
          frango: "Frango"
        };
        if (!family || !options[family]) return simpleWeeklyIngredient(item);
        const label = family === "carne" ? "Carne" : family === "peixe" ? "Peixe" : "Frango";
        return isRestricted(label, restrictions) || isRestricted(simpleWeeklyIngredient(item), restrictions)
          ? ""
          : options[family];
      }

      function generatedWeeklyIngredients(items, dayIndex, restrictions) {
        return uniqueIngredients(items.map((item, index) =>
          ingredientCategory(item) === "protein"
            ? generatedWeeklyProteinName(item, dayIndex + index, restrictions)
            : item
        ));
      }

      function weeklyIsGrain(ingredient) {
        return /\b(arroz|quinoa|aveia|racao)\b/.test(normalize(ingredient));
      }

      function weeklyMeatEnding(items) {
        if (items.length > 1) return "ficarem bem cozidos";
        return normalize(items[0]) === "carne" ? "ficar bem cozida" : "ficar bem cozido";
      }

      function weeklySideEnding(items) {
        const feminine = /\b(batata|batata doce|cenoura|mandioca|mandioquinha|abobora|abobrinha|quinoa|aveia|couve|vagem)\b/;
        const allFeminine = items.every(item => feminine.test(normalize(item)));
        if (items.length > 1) return allFeminine ? "ficarem macias" : "ficarem macios";
        return allFeminine ? "ficar macia" : "ficar macio";
      }

      function weeklyPrep(ingredients) {
        const items = uniqueIngredients(ingredients);
        const meats = items.filter(item => ingredientCategory(item) === "protein");
        const fish = meats.filter(item => normalize(item) === "peixe");
        const chicken = meats.filter(item => normalize(item) === "frango");
        const beef = meats.filter(item => normalize(item) === "carne");
        const eggs = meats.filter(item => /\bovo|ovos\b/.test(normalize(item)));
        const otherMeats = meats.filter(item => !fish.includes(item) && !chicken.includes(item) && !beef.includes(item) && !eggs.includes(item));
        const sides = items.filter(item => ingredientCategory(item) !== "protein");
        const grains = sides.filter(weeklyIsGrain);
        const leaves = sides.filter(weeklyIsLeaf);
        const vegetables = sides.filter(item => !weeklyIsGrain(item) && !weeklyIsLeaf(item));
        const steps = ["Separe todos os ingredientes."];
        if (chicken.length) steps.push(`Corte ${weeklyNaturalListWithArticle(chicken)} em pedaços pequenos. Cozinhe ${weeklyNaturalListWithArticle(chicken)}.`);
        if (beef.length) steps.push(`Corte ${weeklyNaturalListWithArticle(beef)} em pedaços pequenos. Cozinhe ${weeklyNaturalListWithArticle(beef)} até ${weeklyAgreement(beef, "ficar macia", "ficarem macias")}.`);
        if (otherMeats.length) steps.push(`Corte ${weeklyNaturalListWithArticle(otherMeats)} em pedaços pequenos. Cozinhe ${weeklyNaturalListWithArticle(otherMeats)} até ${weeklyAgreement(otherMeats, "ficar bem cozido", "ficarem bem cozidos")}.`);
        if (fish.length) steps.push(`Prepare ${weeklyNaturalListWithArticle(fish)} em pedaços pequenos. Cozinhe ${weeklyNaturalListWithArticle(fish)} até ${weeklyAgreement(fish, "ficar macio", "ficarem macios")}. Retire cuidadosamente todas as espinhas.`);
        if (eggs.length) steps.push(`Cozinhe ${weeklyNaturalListWithArticle(eggs)}, retire a casca e pique em pedaços pequenos.`);
        if (leaves.length) steps.push(`Lave ${weeklyNaturalListWithArticle(leaves)} e corte em tiras finas. Refogue ${weeklyNaturalListWithArticle(leaves)} até murchar levemente.`);
        if (vegetables.length) steps.push(`Lave ${weeklyNaturalListWithArticle(vegetables)} e corte em pedaços pequenos. Cozinhe ${weeklyNaturalListWithArticle(vegetables)} até ${weeklyAgreement(vegetables, "ficar macia", "ficarem macias")}.`);
        if (grains.length) steps.push(`Cozinhe ${weeklyNaturalListWithArticle(grains)} até ${weeklyAgreement(grains, "ficar macio", "ficarem macios")}.`);
        steps.push(`Misture ${weeklyNaturalList(items)}.`);
        steps.push("Aguarde amornar.");
        steps.push("Sirva para o pet.");
        return steps.join(" ");
      }

      function uniqueProteinFamilies(items) {
        const families = new Set();
        return items.filter(item => {
          const family = proteinFamily(item);
          if (!family || families.has(family)) return false;
          families.add(family);
          return true;
        });
      }

      function safeCatalog(category, restrictions, offset) {
        const items = weeklyCatalog[category] || [];
        return items
          .map((_, index) => items[(index + offset) % items.length])
          .filter(item => !isRestricted(item, restrictions));
      }

      function hasCategory(ingredients, category) {
        return ingredients.some(item => ingredientCategory(item) === category);
      }

      function ingredientByCategory(ingredients, category) {
        return ingredients.find(item => ingredientCategory(item) === category) || "";
      }

      function addFirstSafe(ingredients, category, restrictions, offset, avoidIngredients = []) {
        const next = safeCatalog(category, restrictions, offset)
          .find(item => {
            const alreadyUsed = ingredients.some(existing => isRestricted(existing, [item]) || isRestricted(item, [existing]));
            const shouldAvoid = avoidIngredients.some(avoid => isRestricted(item, [avoid]) || isRestricted(avoid, [item]));
            return !alreadyUsed && !shouldAvoid;
          });
        if (next) ingredients.push(next);
      }

      function completeWeeklyIngredients(preferred, restrictions, dayIndex, attempt, avoidIngredients = []) {
        const offset = dayIndex + attempt;
        const ingredients = uniqueIngredients(preferred)
          .filter(item => !isRestricted(item, restrictions))
          .filter(item => ingredientCategory(item));

        const simpleProteins = safeCatalog("protein", restrictions, offset);
        const currentProtein = ingredients.find(item => ingredientCategory(item) === "protein");
        if (!currentProtein || !simpleProteins.some(item => normalize(item) === normalize(currentProtein))) {
          const replacement = simpleProteins.find(item => !avoidIngredients.some(avoid => isRestricted(item, [avoid]) || isRestricted(avoid, [item])));
          const withoutProtein = ingredients.filter(item => ingredientCategory(item) !== "protein");
          ingredients.length = 0;
          ingredients.push(...withoutProtein);
          if (replacement) ingredients.unshift(replacement);
        }
        if (!hasCategory(ingredients, "base")) addFirstSafe(ingredients, "base", restrictions, offset + 1, avoidIngredients);
        if (!hasCategory(ingredients, "vegetable")) addFirstSafe(ingredients, "vegetable", restrictions, offset + 2, avoidIngredients);

        ["protein", "base", "vegetable"].forEach((category, categoryIndex) => {
          if (!hasCategory(ingredients, category)) addFirstSafe(ingredients, category, restrictions, offset + categoryIndex + 3);
        });

        return uniqueIngredients(ingredients).filter(item => !isRestricted(item, restrictions));
      }

      function preferredIngredientsForDay(preferred, customMode, dayIndex, attempt) {
        const safePreferred = uniqueIngredients(preferred);
        if (!safePreferred.length) return [];
        const first = safePreferred[(dayIndex + attempt) % safePreferred.length];
        return first ? [first] : [];
      }

      function recipeKey(ingredients) {
        return uniqueIngredients(ingredients)
          .map(item => normalize(item))
          .sort()
          .join("|");
      }

      function customWeeklyIngredients({ pool, activeRestrictions, dayIndex, usedCombinations }) {
        const preferred = uniqueIngredients(pool).filter(item => !isRestricted(item, activeRestrictions));
        const proteins = uniqueProteinFamilies(safeCatalog("protein", activeRestrictions, 0));
        const bases = safeCatalog("base", activeRestrictions, 0);
        const vegetables = safeCatalog("vegetable", activeRestrictions, 0);
        for (let attempt = 0; attempt < 49; attempt += 1) {
          const ingredients = uniqueIngredients([
            proteins[(dayIndex + attempt) % proteins.length],
            bases[(dayIndex * 2 + attempt + 1) % bases.length],
            vegetables[(dayIndex * 3 + attempt + 2) % vegetables.length]
          ]).filter(Boolean);
          const preferredItem = preferred[dayIndex % preferred.length];
          if (preferredItem && !ingredients.some(item => ingredientCategory(item) === ingredientCategory(preferredItem))) {
            ingredients.push(preferredItem);
          }
          const key = recipeKey(ingredients);
          if (ingredients.length >= 3 && !usedCombinations.has(key)) {
            usedCombinations.add(key);
            return ingredients;
          }
        }
        const fallback = uniqueIngredients([
          proteins[dayIndex % proteins.length],
          bases[(dayIndex + 1) % bases.length],
          vegetables[(dayIndex + 2) % vegetables.length]
        ]).filter(Boolean);
        usedCombinations.add(recipeKey(fallback));
        return fallback;
      }

      function repeatsPreviousCategory(ingredients, previousIngredients) {
        if (!previousIngredients || !previousIngredients.length) return false;
        return ["protein", "base", "vegetable"].some(category => {
          const current = ingredientByCategory(ingredients, category);
          const previous = ingredientByCategory(previousIngredients, category);
          return current && previous && normalize(current) === normalize(previous);
        });
      }

      function uniqueWeeklyIngredients({ pool, activeRestrictions, dayIndex, usedCombinations, previousIngredients }) {
        const preferred = uniqueIngredients(pool).filter(item => !isRestricted(item, activeRestrictions));
        const customMode = document.getElementById("weeklyCustom").checked;
        if (customMode) {
          return customWeeklyIngredients({
            pool: preferred,
            activeRestrictions,
            dayIndex,
            usedCombinations
          });
        }
        for (let attempt = 0; attempt < 21; attempt += 1) {
          const dayPreferred = preferredIngredientsForDay(preferred, customMode, dayIndex, attempt);
          const avoidPreferred = customMode
            ? preferred.filter(item => !dayPreferred.some(selected => isRestricted(item, [selected]) || isRestricted(selected, [item])))
            : [];
          const ingredients = completeWeeklyIngredients(dayPreferred, activeRestrictions, dayIndex, attempt, avoidPreferred);
          const key = recipeKey(ingredients);
          if (ingredients.length >= 3 && !usedCombinations.has(key) && !repeatsPreviousCategory(ingredients, previousIngredients)) {
            usedCombinations.add(key);
            return ingredients;
          }
        }
        const fallback = completeWeeklyIngredients(preferredIngredientsForDay(preferred, customMode, dayIndex, dayIndex), activeRestrictions, dayIndex, dayIndex);
        usedCombinations.add(recipeKey(fallback));
        return fallback;
      }

	      function toggleDayDetails(card) {
        const details = card.querySelector(".week-day-details");
        if (!details) return;
        const shouldOpen = details.hidden;
        weeklyDays.querySelectorAll(".week-day-details").forEach(item => {
          item.hidden = true;
        });
	        details.hidden = !shouldOpen;
	        card.setAttribute("aria-expanded", String(shouldOpen));
      }

      function weeklyModeValue() {
        return document.getElementById("weeklyCustom").checked ? "custom" : "auto";
      }

      function weeklyModeLabel(mode) {
        return mode === "custom" ? "Personalizado" : "Automático";
      }

      function weeklySourceIngredients(profile, customMode) {
        return uniqueIngredients([
          ...customIngredients
        ]);
      }

      function buildWeeklyPlan(profile) {
        const customMode = document.getElementById("weeklyCustom").checked;
        const source = weeklySourceIngredients(profile, customMode);
        const activeRestrictions = activeWeeklyRestrictions(profile);
        const safePreferred = source.filter(item => !isRestricted(item, activeRestrictions));
        const pool = uniqueIngredients(safePreferred);

        const usedCombinations = new Set();
        const usedTitles = new Set();
        let previousIngredients = [];

        return dayNames.map((day, index) => {
          const selectedIngredients = uniqueWeeklyIngredients({
            pool,
            activeRestrictions,
            dayIndex: index,
            usedCombinations,
            previousIngredients
          });
          previousIngredients = selectedIngredients;
          const ingredients = generatedWeeklyIngredients(selectedIngredients, index, activeRestrictions);
          const title = weeklyRecipeTitle(ingredients);
          usedTitles.add(normalize(title));
          const prep = weeklyPrep(ingredients);
          return {
            day,
            planMode: customMode ? "custom" : "auto",
            planModeLabel: customMode ? "Personalizado" : "Automático",
            title,
            ingredients,
            prep,
            customNote: "",
            note: `Observação do chef: plano pensado para ${profile.name || "seu pet"}, respeitando ${profile.age || "a idade"}, ${profile.weight || "o peso"} e mantendo fora do preparo os ingredientes bloqueados.`,
            image: imageForRecipe({ title, ingredients }, index),
            profile: {
              name: profile.name || "seu pet",
              size: profile.size,
              age: profile.age,
              weight: profile.weight
            }
          };
        });
      }

      function refreshPlanImages(plan) {
        return plan.map((item, index) => Object.assign({}, item, {
          image: imageForRecipe({ title: item.title, ingredients: item.ingredients || [] }, index)
        }));
      }

      function imageClientId() {
        return window.BistroPetStorage.getCurrentUser()?.id || "authenticated-user";
      }

      async function generateWeeklyPlanImages(plan) {
        if (!imageEndpoint || !plan.length) return;
        try {
          const response = await fetch(imageEndpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              generationType: "weeklyPlan",
              clientId: imageClientId(),
              recipes: plan.map((item, index) => ({
                id: String(index),
                ingredients: item.ingredients
              }))
            })
          });
          const data = await response.json();
          if (!response.ok || !Array.isArray(data.images)) return;
          data.images.forEach(image => {
            const index = Number(image.id);
            if (!Number.isNaN(index) && currentPlan[index] && image.imageUrl) {
              currentPlan[index].image = image.imageUrl;
            }
          });
          renderProfileWeeklyPlan(currentPlan);
          if (window.BistroPetStorage) await window.BistroPetStorage.saveWeeklyPlan(currentPlan);
        } catch (error) {}
      }

	      async function clearWeeklyPlanState(persist = true) {
	        if (window.BistroPetAccessibility) window.BistroPetAccessibility.stop();
        currentPlan = [];
        activeDayIndex = null;
        weeklyDays.innerHTML = "";
        weeklyPlanner.classList.remove("is-generated");
        if (window.BistroPetStorage && window.BistroPetStorage.saveWeeklyPlan) {
          if (persist) await window.BistroPetStorage.saveWeeklyPlan(null);
        }
      }

      function renderProfileWeeklyPlan(plan) {
        const planMode = weeklyModeValue();
        currentPlan = plan.map(item => Object.assign({
          planMode,
          planModeLabel: weeklyModeLabel(planMode)
        }, item));
        weeklyDays.innerHTML = `
          <div class="day-tabs" aria-label="Dias da semana">
            ${currentPlan.map((item, index) => `
	              <button class="day-tab${activeDayIndex === index ? " active" : ""}" type="button" data-day-index="${index}" aria-pressed="${activeDayIndex === index ? "true" : "false"}" aria-label="${item.day}: ${item.title}">
                ${shortDayName(item.day)}
              </button>
            `).join("")}
          </div>
          <div class="selected-day-recipe">
            ${activeDayIndex === null ? "" : `<div data-selected-day="${currentPlan[activeDayIndex].day}">
              ${createDayCard(
                currentPlan[activeDayIndex].day,
                currentPlan[activeDayIndex].title,
                currentPlan[activeDayIndex].image,
                currentPlan[activeDayIndex],
                true
              )}
            </div>`}
          </div>
        `;
	        weeklyDays.querySelectorAll("[data-day-index]").forEach(button => {
	          button.addEventListener("click", () => {
	            const nextIndex = Number(button.dataset.dayIndex);
	            activeDayIndex = activeDayIndex === nextIndex ? null : nextIndex;
	            renderProfileWeeklyPlan(currentPlan);
	          });
	        });
	        weeklyDays.querySelectorAll("[data-expandable-day]").forEach(card => {
	          card.addEventListener("click", () => toggleDayDetails(card));
	          card.addEventListener("keydown", event => {
	            if (event.key !== "Enter" && event.key !== " ") return;
	            event.preventDefault();
	            toggleDayDetails(card);
	          });
	        });
        weeklyPlanner.classList.add("is-generated");
      }

      function refreshProfileCopy(profile) {
        const name = profile.name || "Luna";
        const article = normalize(name).endsWith("a") ? "da" : "do";
        document.querySelector(".chef-pet-card strong").textContent = name;
        document.querySelector(".weekly-heading h1").textContent = `O chef vai organizar a semana ${article} ${name}.`;
        document.querySelector(".weekly-result-card h2").textContent = `Plano semanal ${article} ${name}`;
      }

      async function updateModeState() {
        const customMode = document.getElementById("weeklyCustom").checked;
        const nextMode = customMode ? "custom" : "auto";
        if (activeWeeklyMode !== nextMode) {
          await clearWeeklyPlanState();
        }
        activeWeeklyMode = nextMode;
        weeklyPlanner.classList.toggle("is-custom-mode", customMode);
        createWeekPlanButton.textContent = "Criar plano da semana";
      }

      function isSavedPlanValid(plan, profile) {
        const restrictions = activeWeeklyRestrictions(profile);
        return Array.isArray(plan) && plan.length === 7 && !plan.some(item => {
          const text = `${item.title || ""} ${(item.ingredients || []).join(" ")}`;
          return isRestricted(text, restrictions);
        });
      }

      async function generateProfileWeeklyPlan() {
        const profile = window.BistroPetStorage.getPetProfile();
        await clearWeeklyPlanState(false);
        const plan = buildWeeklyPlan(profile);
        activeDayIndex = null;
        renderProfileWeeklyPlan(plan);
        await window.BistroPetStorage.saveWeeklyPlan(currentPlan);
        generateWeeklyPlanImages(plan);
      }

      const savedProfile = window.BistroPetStorage.getPetProfile();
      refreshProfileCopy(savedProfile);
      const savedPlan = window.BistroPetStorage.getWeeklyPlan();
      if (isSavedPlanValid(savedPlan, savedProfile)) {
        const customSavedPlan = savedPlan[0]?.planMode === "custom";
        document.getElementById("weeklyCustom").checked = customSavedPlan;
        document.getElementById("weeklyAuto").checked = !customSavedPlan;
        activeWeeklyMode = customSavedPlan ? "custom" : "auto";
        weeklyPlanner.classList.toggle("is-custom-mode", customSavedPlan);
        renderProfileWeeklyPlan(savedPlan);
      } else {
        await clearWeeklyPlanState(false);
        await updateModeState();
      }
      document.getElementById("weeklyAuto").addEventListener("change", () => updateModeState().catch(error => alert(error.message)));
      document.getElementById("weeklyCustom").addEventListener("change", () => updateModeState().catch(error => alert(error.message)));
	      createWeekPlanButton.addEventListener("click", () => generateProfileWeeklyPlan().catch(error => alert(error.message || "Não foi possível salvar o plano.")));
	      document.getElementById("listenWeeklyPlan").addEventListener("click", () => {
	        if (activeDayIndex !== null && currentPlan[activeDayIndex] && window.BistroPetAccessibility) {
	          window.BistroPetAccessibility.speakWeeklyDay(currentPlan[activeDayIndex]);
	        }
	      });
	      document.getElementById("stopWeeklyAudio").addEventListener("click", () => {
	        if (window.BistroPetAccessibility) window.BistroPetAccessibility.stop();
	      });
      })().catch(error => alert(error.message || "Não foi possível carregar o plano semanal."));
    </script>
  </body>
</html>
