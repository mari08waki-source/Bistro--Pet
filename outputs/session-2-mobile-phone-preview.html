<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bistro Pet Session 2 Preview</title>
    <style>
      :root {
        --off: #fbf8f1;
        --shadow: rgba(46, 51, 43, 0.24);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 18%, #fffdf8 0, var(--off) 44%, #ebe5d9 100%);
      }

      .phone {
        width: 430px;
        height: 961px;
        padding: 12px;
        border-radius: 52px;
        background: linear-gradient(145deg, #343b32, #141712 55%, #4f5a4c);
        box-shadow: 0 36px 90px var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        position: relative;
      }

      .phone::before {
        content: "";
        position: absolute;
        z-index: 2;
        top: 17px;
        left: 50%;
        width: 118px;
        height: 28px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #0f120f;
      }

      .screen {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 42px;
        background: var(--off);
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="screen">
        <img src="./session-2-mobile-preview.png?v=session2-margin-match-section3" alt="Preview mobile da Session 2 Bistro Pet" />
      </div>
    </div>
  </body>
</html>
