<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bistro Pet - Plano Semanal</title>
    <link rel="stylesheet" href="./styles.css?v=session4-weekly-plan" />
    <style>
      #weeklyPlanner .weekly-kitchen-stage { min-height: 520px; }
      #weeklyPlanner .weekly-result-card { position: relative; left: auto; right: auto; top: auto; margin: 18px 14px; }
      #weeklyPlanner .weekly-days { overflow: visible; }
      #weeklyPlanner .week-day-card { align-items: start; }
      #weeklyPlanner .week-day-details { margin-top: 8px; font-size: 11px; line-height: 1.35; color: var(--muted); }
      #weeklyPlanner .week-day-details p { margin: 0 0 6px; }
      #weeklyPlanner .day-tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
      #weeklyPlanner .day-tab { border: 1px solid rgba(46, 51, 43, 0.13); background: rgba(255, 253, 248, 0.72); border-radius: 999px; padding: 7px 0; font-size: 11px; color: var(--sage-dark); }
      #weeklyPlanner .day-tab.active { background: #f0eadf; color: var(--ink); }
      #weeklyPlanner .selected-day-recipe { margin-top: 12px; }
      #weeklyPlanner .selected-day-recipe .week-day-card { grid-template-columns: 68px 1fr; }
      #weeklyPlanner .selected-day-recipe .week-day-card img { width: 68px; height: 58px; }
      #weeklyPlanner .custom-plan-copy { display: none; margin: 6px 0 4px; color: #8c7040; font-size: 12px; line-height: 1.2; }
      #weeklyPlanner .custom-plan-copy strong { display: block; color: #a27a35; font-size: 13px; margin-bottom: 0; letter-spacing: .04em; }
      #weeklyPlanner.is-custom-mode .weekly-ingredients > span,
      #weeklyPlanner.is-custom-mode .weekly-ingredients > small,
      #weeklyPlanner.is-custom-mode #weeklyChips { display: none; }
      #weeklyPlanner.is-custom-mode .weekly-controls { background: linear-gradient(180deg, rgba(255, 248, 232, 0.96), rgba(244, 224, 184, 0.82)); border-color: rgba(196, 145, 53, 0.26); }
      #weeklyPlanner.is-custom-mode .kitchen-switch[for="weeklyCustom"] { background: rgba(234, 216, 180, 0.82); color: #76551f; }
      #weeklyPlanner .weekly-ingredients { max-height: none; opacity: 1; overflow: visible; transform: none; }
      #weeklyPlanner.is-custom-mode .weekly-ingredients { display: grid; gap: 6px; }
      #weeklyPlanner #weeklyCustom:checked ~ .weekly-ingredients { max-height: none; overflow: visible; }
      #weeklyPlanner:not(.is-custom-mode) .weekly-ingredients > span,
      #weeklyPlanner:not(.is-custom-mode) .weekly-ingredients > small,
      #weeklyPlanner:not(.is-custom-mode) #weeklyChips { display: none; }
      #weeklyPlanner .custom-special-card { display: none; gap: 5px; padding: 6px; border: 1px solid rgba(120, 148, 96, 0.22); border-radius: 12px; background: rgba(238, 247, 229, 0.72); }
      #weeklyPlanner.is-custom-mode .custom-plan-copy,
      #weeklyPlanner.is-custom-mode .custom-special-card,
      #weeklyPlanner.is-custom-mode .custom-ingredient-row,
      #weeklyPlanner.is-custom-mode .custom-blocked-card { display: grid; }
      #weeklyPlanner.is-custom-mode .custom-plan-copy { color: #617753; margin: 0; }
      #weeklyPlanner.is-custom-mode .custom-plan-copy strong { color: #5f744d; font-size: 12px; }
      #weeklyPlanner .custom-ingredient-row { display: none; grid-template-columns: minmax(0, 1fr) auto; gap: 5px; margin-top: 3px; padding: 3px; border: 1px solid rgba(120, 148, 96, 0.28); border-radius: 999px; background: rgba(238, 247, 229, 0.78); box-shadow: 0 8px 18px rgba(94, 122, 73, 0.08); }
      #weeklyPlanner .custom-ingredient-row input { min-width: 0; border: 0; border-radius: 999px; background: transparent; padding: 6px 9px; color: var(--ink); outline: 0; font-size: 12px; }
      #weeklyPlanner .custom-ingredient-row button { border: 0; border-radius: 999px; background: #d8e6c8; color: #52683f; padding: 6px 10px; font-size: 12px; font-weight: 700; }
      #weeklyPlanner .custom-chip-list { display: none; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
      #weeklyPlanner.is-custom-mode .custom-chip-list { display: flex; }
      #weeklyPlanner .custom-ingredient-message { min-height: 0; margin-top: 0; color: #8c7040; font-size: 11px; line-height: 1.2; }
      #weeklyPlanner .custom-chip-list .ingredient-chip { padding: 6px 9px; font-size: 11px; }
      #weeklyPlanner .custom-chip-list .ingredient-chip button { margin-left: 5px; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      #weeklyPlanner .custom-blocked-card { display: grid; gap: 5px; margin-top: 6px; padding: 6px; border: 1px solid rgba(177, 91, 82, 0.22); border-radius: 12px; background: rgba(255, 238, 232, 0.72); }
      #weeklyPlanner .custom-blocked-title { color: #9a5147; font-size: 11px; font-weight: 800; letter-spacing: .03em; }
      #weeklyPlanner .custom-blocked-card .custom-ingredient-row { display: grid; margin-top: 0; border-color: rgba(177, 91, 82, 0.24); background: rgba(255, 250, 247, 0.82); box-shadow: none; }
      #weeklyPlanner .custom-blocked-card .custom-ingredient-row button { background: #efd1c9; color: #8b473e; }
      #weeklyPlanner .custom-blocked-card .custom-chip-list { display: flex; }
    </style>
  </head>
  <body class="session-three-body">
    <main class="meal-session bistro-generator">
      <section class="chef-pet-card">
        <img src="./session-3-chef-akita.png" alt="Akita chef do Bistro Pet" />
        <div>
          <strong>Luna</strong>
          <span>Menu preparado pelo Bistro</span>
        </div>
      </section>

      <section class="bistro-menu weekly-heading">
        <p class="meal-eyebrow">Menu Bistro</p>
        <h1>O chef vai organizar a semana da Luna.</h1>
      </section>

      <section class="weekly-planner" id="weeklyPlanner">
        <div class="weekly-controls">
          <input class="weekly-mode-input" type="radio" name="weekly-mode" id="weeklyAuto" checked />
          <input class="weekly-mode-input" type="radio" name="weekly-mode" id="weeklyCustom" />

          <div class="kitchen-switches" aria-label="Modos do plano semanal">
            <label class="kitchen-switch" for="weeklyAuto">
              <span>Modo Automático</span>
              <i aria-hidden="true"></i>
            </label>
            <label class="kitchen-switch" for="weeklyCustom">
              <span>Modo Personalizado</span>
              <i aria-hidden="true"></i>
            </label>
          </div>

          <div class="weekly-ingredients">
            <span>Ingredientes</span>
            <small>Ingredientes especiais</small>
            <div class="custom-special-card" id="customSpecialCard">
              <div class="custom-plan-copy" id="customPlanCopy">
                <strong>Ingredientes especiais</strong>
              </div>
              <div class="custom-ingredient-row" id="customIngredientRow">
                <input id="customIngredientInput" type="text" placeholder="Novo ingrediente" />
                <button id="confirmIngredient" type="button">Adicionar</button>
              </div>
              <div class="custom-chip-list" id="customChipList" aria-label="Ingredientes personalizados"></div>
              <div class="custom-ingredient-message" id="customIngredientMessage" aria-live="polite"></div>
            </div>
            <div class="ingredient-chips" id="weeklyChips">
            </div>
            <div class="custom-blocked-card" id="customBlockedCard">
              <span class="custom-blocked-title">&#128308; Ingredientes proibidos</span>
              <div class="custom-ingredient-row">
                <input id="customBlockedInput" type="text" placeholder="Ingrediente proibido" />
                <button id="confirmBlockedIngredient" type="button">Adicionar</button>
              </div>
              <div class="custom-chip-list" id="customBlockedChipList" aria-label="Ingredientes proibidos personalizados"></div>
              <div class="custom-ingredient-message" id="customBlockedMessage" aria-live="polite"></div>
            </div>
          </div>

          <button class="primary full create-week-plan" type="button" id="createWeekPlan">Criar semana com receitas e imagens</button>
        </div>

        <div class="weekly-kitchen-stage">
          <img src="./session-3-sleeping-kitchen.png" alt="Cozinha premium do Bistro Pet preparando o plano semanal" />
          <div class="frosted-message weekly-empty-message">
            <span>Bistro em preparo</span>
            <p>O chef está organizando a próxima semana</p>
          </div>

          <div class="weekly-result-card" id="weeklyResultCard">
            <span class="recipe-note">Plano assinado pelo chef</span>
            <h2>Plano delicado da Luna</h2>
            <div class="weekly-days" id="weeklyDays"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="./bistropet-storage.js"></script>
    <script>
      const weeklyPlanner = document.getElementById("weeklyPlanner");
      const weeklyDays = document.getElementById("weeklyDays");
      const weeklyChips = [...document.querySelectorAll("#weeklyChips .ingredient-chip:not(.add-chip)")];
      const addIngredientButton = document.querySelector("#weeklyChips .add-chip");
      const customIngredientInput = document.getElementById("customIngredientInput");
      const confirmIngredientButton = document.getElementById("confirmIngredient");
      const customIngredientMessage = document.getElementById("customIngredientMessage");
      const customChipList = document.getElementById("customChipList");
      const customBlockedInput = document.getElementById("customBlockedInput");
      const confirmBlockedIngredientButton = document.getElementById("confirmBlockedIngredient");
      const customBlockedMessage = document.getElementById("customBlockedMessage");
      const customBlockedChipList = document.getElementById("customBlockedChipList");
      const createWeekPlanButton = document.getElementById("createWeekPlan");
      const customIngredients = [];
      const customBlockedIngredients = [];
      let currentPlan = [];
      let activeDayIndex = null;
      let activeWeeklyMode = "auto";

      weeklyChips.forEach(chip => chip.addEventListener("click", () => chip.classList.toggle("active")));

      function createDayCard(day, title, image, details, open = false) {
        const detailMarkup = details && Array.isArray(details.ingredients) ? `
          <div class="week-day-details"${open ? "" : " hidden"}>
            <p><strong>Ingredientes</strong>: ${details.ingredients.join(", ")}</p>
            <p><strong>Modo de preparo</strong>: ${details.prep}</p>
            <p>${details.customNote || details.note}</p>
          </div>
        ` : "";
        return `
          <article class="week-day-card" role="button" tabindex="0" data-expandable-day>
            <img src="${image}" alt="${title}" />
            <div>
              <strong>${day}</strong>
              <span>${title}</span>
              ${detailMarkup}
            </div>
          </article>
        `;
      }

      function shortDayName(day) {
        return {
          "Segunda": "Seg",
          "Terça": "Ter",
          "Quarta": "Qua",
          "Quinta": "Qui",
          "Sexta": "Sex",
          "Sábado": "Sáb",
          "Domingo": "Dom"
        }[day] || day.slice(0, 3);
      }

      const dayNames = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"];
      const allowedIngredientTerms = [
        ["frango", "Frango"],
        ["carne", "Carne"],
        ["patinho", "Patinho"],
        ["mandioca", "Mandioca"],
        ["aipim", "Mandioca"],
        ["macaxeira", "Mandioca"],
        ["pepino", "Pepino"],
        ["racao", "Ração"],
        ["ração", "Ração"],
        ["arroz", "Arroz"],
        ["abobora", "Abóbora"],
        ["peixe", "Peixe"],
        ["batata doce", "Batata doce"],
        ["batata", "Batata"],
        ["cenoura", "Cenoura"],
        ["ovos", "Ovos"],
        ["ovo", "Ovos"],
        ["quinoa", "Quinoa"],
        ["chuchu", "Chuchu"],
        ["abobrinha", "Abobrinha"],
        ["patinho", "Patinho"],
        ["mandioquinha", "Mandioquinha"]
      ];
      const planNames = ["Bowl leve", "Menu delicado", "Prato bistrô", "Combinação suave", "Receita aconchegante"];
      const customPlanNames = [
        "Bowl delicado",
        "Creme morno",
        "Menu suave",
        "Prato leve",
        "Mix bistro",
        "Jardim macio",
        "Receita de chef"
      ];
      const textureNotes = ["textura cremosa", "preparo macio", "base úmida", "cubos delicados", "lascas suaves", "mistura aveludada", "porção leve"];
      const presentationNotes = ["em bowl baixo", "com finalização central", "em camadas delicadas", "com base cremosa", "em porção compacta", "com toque rústico", "em montagem suave"];
      const prepTemplates = [
        "Cozinhe os ingredientes listados separadamente até ficarem macios, una em textura delicada e sirva morno.",
        "Prepare os ingredientes listados em cocção lenta, corte suavemente e finalize sem temperos fortes.",
        "Cozinhe bem os ingredientes, una em pequenas porções e ajuste a umidade antes de servir.",
        "Deixe tudo bem macio, misture com cuidado e ofereça em temperatura confortável.",
        "Cozinhe a base principal, incorpore os demais itens listados no final e sirva com textura úmida.",
        "Prepare os ingredientes em cubos pequenos, una tudo ainda morno e aguarde esfriar levemente.",
        "Cozinhe até ficar macio, solte em lascas delicadas quando necessário e sirva em pequenas porções."
      ];

      const customChefNotesClean = [
        "Observa\u00e7\u00e3o do chef: uma abertura delicada para a semana, feita sob medida para a Luna.",
        "Observa\u00e7\u00e3o do chef: preparo leve, com contraste suave de textura e apresenta\u00e7\u00e3o acolhedora.",
        "Observa\u00e7\u00e3o do chef: combina\u00e7\u00e3o pensada para variar sem sair dos ingredientes escolhidos.",
        "Observa\u00e7\u00e3o do chef: por\u00e7\u00e3o elegante, macia e confort\u00e1vel para uma rotina especial.",
        "Observa\u00e7\u00e3o do chef: montagem com toque de bistr\u00f4, respeitando a lista personalizada.",
        "Observa\u00e7\u00e3o do chef: receita aconchegante, ideal para servir morna e bem equilibrada.",
        "Observa\u00e7\u00e3o do chef: fechamento da semana com composi\u00e7\u00e3o simples, bonita e cuidadosa."
      ];

      function normalize(value) {
        return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      }

      function imageTermsForRecipe(recipe) {
        const text = normalize(`${recipe.title} ${(recipe.ingredients || []).join(" ")}`);
        const terms = ["food"];
        if (text.includes("carne") || text.includes("patinho")) terms.push("beef");
        if (text.includes("mandioca")) terms.push("cassava");
        if (text.includes("pepino")) terms.push("cucumber");
        if (text.includes("frango")) terms.push("chicken");
        if (text.includes("peixe")) terms.push("fish");
        if (text.includes("arroz")) terms.push("rice");
        if (text.includes("batata")) terms.push("potato");
        if (text.includes("cenoura")) terms.push("carrot");
        if (text.includes("abobora")) terms.push("pumpkin");
        if (text.includes("ovo")) terms.push("egg");
        if (text.includes("quinoa")) terms.push("quinoa");
        if (text.includes("abobrinha")) terms.push("zucchini");
        return [...new Set(terms)];
      }

      function imageForRecipe(recipe, index) {
        const terms = imageTermsForRecipe(recipe).map(item => encodeURIComponent(item)).join(",");
        return `https://loremflickr.com/1024/768/${terms}?random=${Date.now() + index}`;
      }

      function splitList(value) {
        return String(value || "").split(/[,.;\n]/).map(item => item.trim()).filter(Boolean);
      }

      function extractIngredientTerms(value) {
        const found = [];
        const cleanText = normalize(value);
        allowedIngredientTerms.forEach(([term, label]) => {
          if (cleanText.includes(term) && !found.some(existing => isRestricted(label, [existing]) || isRestricted(existing, [label]))) {
            found.push(label);
          }
        });
        return found;
      }

      function cleanCustomIngredient(value) {
        return String(value || "").trim().replace(/\s+/g, " ");
      }

      function cleanCustomIngredientList(value) {
        const clean = cleanCustomIngredient(value);
        if (!clean) return [];
        if (/[,.;\n]/.test(clean)) return splitList(clean).map(cleanCustomIngredient).filter(Boolean);
        const knownItems = extractIngredientTerms(clean);
        return knownItems.length ? knownItems : [clean];
      }

      function restrictionTerms(profile) {
        return uniqueIngredients([
          ...extractIngredientTerms(profile.restrictions),
          ...splitList(profile.restrictions)
        ]);
      }

      function profileBlockedIngredients() {
        return [];
      }

      function saveProfileBlockedIngredients(items) {
        window.BistroPetStorage.savePetProfile({
          restrictions: uniqueIngredients(items).join(", ")
        });
        try {
          window.localStorage.removeItem("bistropet:global-blocked-ingredients");
        } catch (error) {}
      }

      function isRestricted(ingredient, restrictions) {
        const cleanIngredient = normalize(ingredient);
        return restrictions.some(item => {
          const cleanRestriction = normalize(item);
          if (!cleanRestriction) return false;
          if (cleanIngredient.includes(cleanRestriction) || cleanRestriction.includes(cleanIngredient)) return true;
          if ((cleanRestriction.includes("carne") || cleanRestriction.includes("bovina")) && ["patinho", "carne", "carne bovina"].includes(cleanIngredient)) return true;
          return false;
        });
      }

      function hasRestrictedText(value, restrictions) {
        const cleanValue = normalize(value);
        return restrictions.some(item => {
          const cleanRestriction = normalize(item);
          return cleanRestriction && cleanValue.includes(cleanRestriction);
        });
      }

      function uniqueIngredients(items) {
        return items.filter((item, itemIndex, list) => {
          const cleanItem = normalize(item);
          return list.findIndex(candidate => {
            const cleanCandidate = normalize(candidate);
            return cleanCandidate.includes(cleanItem) || cleanItem.includes(cleanCandidate);
          }) === itemIndex;
        });
      }

      function selectedIngredients() {
        return [];
      }

      function renderCustomChips() {
        customChipList.innerHTML = customIngredients.map(item => `
          <button class="ingredient-chip active" type="button" data-custom-ingredient="${item}">${item}</button>
        `).join("");
        customChipList.querySelectorAll("[data-custom-ingredient]").forEach(chip => {
          chip.addEventListener("click", () => {
            const index = customIngredients.findIndex(item => normalize(item) === normalize(chip.dataset.customIngredient));
            if (index >= 0) customIngredients.splice(index, 1);
            renderCustomChips();
            clearWeeklyPlanState();
          });
        });
      }

      function renderCustomBlockedChips() {
        customBlockedChipList.innerHTML = customBlockedIngredients.map(item => `
          <span class="ingredient-chip active">${item}<button type="button" aria-label="Remover ${item}" data-custom-blocked="${normalize(item)}">×</button></span>
        `).join("");
        customBlockedChipList.querySelectorAll("[data-custom-blocked]").forEach(chip => {
          chip.addEventListener("click", () => {
            const index = customBlockedIngredients.findIndex(item => normalize(item) === normalize(chip.dataset.customBlocked));
            if (index >= 0) customBlockedIngredients.splice(index, 1);
            renderCustomBlockedChips();
            clearWeeklyPlanState();
          });
        });
      }

      function addCustomBlockedIngredient() {
        const ingredients = cleanCustomIngredientList(customBlockedInput.value);
        customBlockedMessage.textContent = "";
        if (!ingredients.length) return;
        const customBlocked = ingredients.find(ingredient => isRestricted(ingredient, customBlockedIngredients));
        if (customBlocked) {
          customIngredientMessage.textContent = "Esse ingrediente já está nos proibidos.";
          return;
        }
        ingredients.forEach(ingredient => {
          const selectedIndex = customIngredients.findIndex(item => normalize(item) === normalize(ingredient));
          if (selectedIndex >= 0) customIngredients.splice(selectedIndex, 1);
          if (!customBlockedIngredients.some(item => normalize(item) === normalize(ingredient))) {
            customBlockedIngredients.push(ingredient);
          }
        });
        renderCustomChips();
        renderCustomBlockedChips();
        customBlockedInput.value = "";
        clearWeeklyPlanState();
      }

      function addCustomIngredient() {
        const restrictions = customBlockedIngredients;
        const ingredients = cleanCustomIngredientList(customIngredientInput.value);
        customIngredientMessage.textContent = "";
        if (!ingredients.length) return;
        const blocked = ingredients.find(ingredient => isRestricted(ingredient, restrictions));
        if (blocked) {
          customIngredientMessage.textContent = "Esse ingrediente está nos proibidos.";
          return;
        }
        ingredients.forEach(ingredient => {
          if (isRestricted(ingredient, customBlockedIngredients)) return;
          if (!customIngredients.some(item => normalize(item) === normalize(ingredient))) {
            customIngredients.push(ingredient);
          }
        });
        renderCustomChips();
        customIngredientInput.value = "";
        clearWeeklyPlanState();
        return;
        if (customIngredients.some(item => normalize(item) === normalize(ingredient))) {
          customIngredientMessage.textContent = `${ingredient} já está na seleção personalizada.`;
          return;
        }
        customIngredients.push(ingredient);
        renderCustomChips();
        customIngredientInput.value = "";
      }

      function recipeIngredients(pool, index) {
        const picked = [];
        const limit = Math.min(3, pool.length);
        for (let offset = 0; offset < pool.length && picked.length < limit; offset += 1) {
          const item = pool[(index + offset) % pool.length];
          if (item && !picked.some(existing => normalize(existing) === normalize(item))) picked.push(item);
        }
        return picked;
      }

      function customRecipeIngredients(bases, support, index) {
        return recipeIngredients(bases, index);
      }

      function completeCustomRecipeIngredients(required, complements, restrictions, index) {
        return recipeIngredients(required.filter(item => !isRestricted(item, restrictions)), index);
      }

      function recipeKey(ingredients) {
        return uniqueIngredients(ingredients)
          .map(item => normalize(item))
          .sort()
          .join("|");
      }

      function uniqueWeeklyIngredients({ pool, activeRestrictions, dayIndex, usedCombinations }) {
        const safePool = uniqueIngredients(pool).filter(item => !isRestricted(item, activeRestrictions));
        const ingredients = recipeIngredients(safePool, dayIndex);
        usedCombinations.add(recipeKey(ingredients));
        return ingredients;
      }

      function toggleDayDetails(card) {
        const details = card.querySelector(".week-day-details");
        if (!details) return;
        const shouldOpen = details.hidden;
        weeklyDays.querySelectorAll(".week-day-details").forEach(item => {
          item.hidden = true;
        });
        details.hidden = !shouldOpen;
      }

      function weeklySourceIngredients(profile, customMode) {
        return uniqueIngredients(customIngredients);
      }

      function buildWeeklyPlan(profile) {
        const customMode = document.getElementById("weeklyCustom").checked;
        const source = weeklySourceIngredients(profile, customMode);
        const activeRestrictions = uniqueIngredients(customBlockedIngredients);
        const safePreferred = source.filter(item => !isRestricted(item, activeRestrictions));
        const pool = uniqueIngredients(safePreferred);

        const usedCombinations = new Set();
        const usedTitles = new Set();

        return dayNames.map((day, index) => {
          const ingredients = uniqueWeeklyIngredients({
            pool,
            activeRestrictions,
            dayIndex: index,
            usedCombinations
          });
          const base = ingredients[0] || "ingrediente informado";
          const pair = ingredients[1] || base;
          let titlePrefixIndex = index;
          let title = "";
          do {
            title = customMode
              ? `${customPlanNames[titlePrefixIndex % customPlanNames.length]} de ${base.toLowerCase()}${ingredients.length > 1 ? ` com ${pair.toLowerCase()}` : ""}`
              : `${planNames[titlePrefixIndex % planNames.length]} de ${base.toLowerCase()} com ${pair.toLowerCase()}`;
            titlePrefixIndex += 1;
          } while (usedTitles.has(normalize(title)) && titlePrefixIndex < index + 14);
          usedTitles.add(normalize(title));
          const prep = customMode
            ? `${prepTemplates[index % prepTemplates.length]} Finalize com ${textureNotes[index % textureNotes.length]} ${presentationNotes[index % presentationNotes.length]}.`
            : prepTemplates[index % prepTemplates.length];
          const ingredientText = ingredients.join(", ");
          const safeTitle = hasRestrictedText(title, activeRestrictions) ? `${customMode ? customPlanNames[index % customPlanNames.length] : planNames[index % planNames.length]} personalizado` : title;
          const safePrep = hasRestrictedText(prep, activeRestrictions) ? prepTemplates[(index + 1) % prepTemplates.length] : prep;
          const safeCustomNote = customMode && hasRestrictedText(customChefNotesClean[index % customChefNotesClean.length], activeRestrictions) ? "Observa\u00e7\u00e3o do chef: receita personalizada, leve e fiel aos ingredientes permitidos." : customChefNotesClean[index % customChefNotesClean.length];
          return {
            day,
            title: safeTitle,
            ingredients,
            prep: `${safePrep} Ingredientes usados: ${ingredientText}.`,
            customNote: customMode ? safeCustomNote : "",
            note: `Observação do chef: plano pensado para ${profile.name || "seu pet"}, respeitando ${profile.age || "a idade"}, ${profile.weight || "o peso"} e mantendo fora do preparo os ingredientes bloqueados.`,
            image: imageForRecipe({ title: safeTitle, ingredients }, index),
            profile: {
              name: profile.name || "seu pet",
              size: profile.size,
              age: profile.age,
              weight: profile.weight
            }
          };
        });
      }

      function refreshPlanImages(plan) {
        return plan.map((item, index) => Object.assign({}, item, {
          image: imageForRecipe({ title: item.title, ingredients: item.ingredients || [] }, index)
        }));
      }

      function clearWeeklyPlanState() {
        currentPlan = [];
        activeDayIndex = null;
        weeklyDays.innerHTML = "";
        weeklyPlanner.classList.remove("is-generated");
        if (window.BistroPetStorage && window.BistroPetStorage.saveWeeklyPlan) {
          window.BistroPetStorage.saveWeeklyPlan(null);
        }
      }

      function renderProfileWeeklyPlan(plan) {
        currentPlan = plan;
        weeklyDays.innerHTML = `
          <div class="day-tabs" aria-label="Dias da semana">
            ${plan.map((item, index) => `
              <button class="day-tab${activeDayIndex === index ? " active" : ""}" type="button" data-day-index="${index}">
                ${shortDayName(item.day)}
              </button>
            `).join("")}
          </div>
          <div class="selected-day-recipe">
            ${activeDayIndex === null ? "" : `<div data-selected-day="${plan[activeDayIndex].day}">
              ${createDayCard(
                plan[activeDayIndex].day,
                plan[activeDayIndex].title,
                plan[activeDayIndex].image,
                plan[activeDayIndex],
                true
              )}
            </div>`}
          </div>
        `;
        weeklyDays.querySelectorAll("[data-day-index]").forEach(button => {
          button.addEventListener("click", () => {
            const nextIndex = Number(button.dataset.dayIndex);
            activeDayIndex = activeDayIndex === nextIndex ? null : nextIndex;
            renderProfileWeeklyPlan(currentPlan);
          });
        });
        weeklyPlanner.classList.add("is-generated");
      }

      function refreshProfileCopy(profile) {
        const name = profile.name || "Luna";
        const article = normalize(name).endsWith("a") ? "da" : "do";
        document.querySelector(".chef-pet-card strong").textContent = name;
        document.querySelector(".weekly-heading h1").textContent = `O chef vai organizar a semana ${article} ${name}.`;
        document.querySelector(".weekly-result-card h2").textContent = `Plano delicado ${article} ${name}`;
      }

      function updateModeState() {
        const customMode = document.getElementById("weeklyCustom").checked;
        const nextMode = customMode ? "custom" : "auto";
        if (activeWeeklyMode !== nextMode) {
          customIngredients.splice(0, customIngredients.length);
          customBlockedIngredients.splice(0, customBlockedIngredients.length);
          renderCustomChips();
          renderCustomBlockedChips();
          clearWeeklyPlanState();
        }
        activeWeeklyMode = nextMode;
        weeklyPlanner.classList.toggle("is-custom-mode", customMode);
        customIngredientMessage.textContent = "";
        customBlockedMessage.textContent = "";
        createWeekPlanButton.textContent = customMode ? "Criar plano da semana" : "Criar semana com receitas e imagens";
      }

      function isSavedPlanValid(plan, profile) {
        const restrictions = extractIngredientTerms(profile.restrictions);
        return Array.isArray(plan) && plan.length === 7 && !plan.some(item => {
          const text = `${item.title || ""} ${(item.ingredients || []).join(" ")}`;
          return isRestricted(text, restrictions);
        });
      }

      function generateProfileWeeklyPlan() {
        const profile = window.BistroPetStorage.getPetProfile();
        const customMode = document.getElementById("weeklyCustom").checked;
        const source = weeklySourceIngredients(profile, customMode).filter(item => !isRestricted(item, customBlockedIngredients));
        if (!source.length) {
          customIngredientMessage.textContent = customMode
            ? "Adicione pelo menos um ingrediente para criar o plano personalizado."
            : "Crie uma receita ou informe preferências no perfil antes de gerar o plano semanal.";
          return;
        }
        clearWeeklyPlanState();
        const plan = buildWeeklyPlan(profile);
        activeDayIndex = null;
        renderProfileWeeklyPlan(plan);
      }

      const savedProfile = window.BistroPetStorage.getPetProfile();
      refreshProfileCopy(savedProfile);
      clearWeeklyPlanState();
      updateModeState();
      renderCustomBlockedChips();
      document.getElementById("weeklyAuto").addEventListener("change", updateModeState);
      document.getElementById("weeklyCustom").addEventListener("change", updateModeState);
      if (addIngredientButton) {
        addIngredientButton.addEventListener("click", () => {
          document.getElementById("weeklyCustom").checked = true;
          updateModeState();
          customIngredientInput.focus();
        });
      }
      confirmIngredientButton.addEventListener("click", addCustomIngredient);
      customIngredientInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          addCustomIngredient();
        }
      });
      confirmBlockedIngredientButton.addEventListener("click", addCustomBlockedIngredient);
      customBlockedInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          addCustomBlockedIngredient();
        }
      });
      createWeekPlanButton.addEventListener("click", generateProfileWeeklyPlan);
    </script>
  </body>
</html>
