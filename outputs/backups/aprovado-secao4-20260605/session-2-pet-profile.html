<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bistro Pet - Perfil do Pet</title>
    <link rel="stylesheet" href="./styles.css?v=session2-profile" />
  </head>
  <body class="session-two-body">
    <main class="profile-session">
      <section class="profile-hero">
        <img src="./session-2-pet-profile-hero.png" alt="Cuidado premium e afetivo com pet em rotina elegante" />
        <div class="profile-hero-shade"></div>
        <div class="profile-hero-copy">
          <div class="brand-button profile-brand">
            Bistro Pet
            <span>perfil do pet</span>
          </div>
          <p>Um cuidado mais &iacute;ntimo come&ccedil;a conhecendo os pequenos detalhes.</p>
        </div>
      </section>

      <section class="profile-content">
        <div class="profile-title">
          <span>Perfil afetivo</span>
          <h1>Conhecer para cuidar melhor.</h1>
        </div>

        <form class="pet-profile-card" id="petProfileForm">
          <label>
            Nome do pet
            <input name="name" />
          </label>
          <label>
            Nome do tutor
            <input name="tutor" />
          </label>
          <div class="field-row">
            <label>
              Idade
              <input name="age" />
            </label>
            <label>
              Peso
              <input name="weight" />
            </label>
          </div>
          <label>
            Porte
            <input name="size" />
          </label>
          <section class="menu-style" aria-label="Estilo do card&aacute;pio">
            <span class="menu-style-title">Estilo do card&aacute;pio</span>
            <input class="mode-radio" type="radio" name="menu-style" id="freeProfile" checked />
            <input class="mode-radio" type="radio" name="menu-style" id="customProfile" />
            <div class="mode-options">
              <label class="mode-option" for="freeProfile">
                <span>
                  <strong>Perfil Livre</strong>
                  <small>Para pets sem prefer&ecirc;ncias espec&iacute;ficas.</small>
                </span>
                <span class="switch" aria-hidden="true"></span>
              </label>
              <label class="mode-option" for="customProfile">
                <span>
                  <strong>Perfil Personalizado</strong>
                  <small>Quando existe algum cuidado ou prefer&ecirc;ncia especial.</small>
                </span>
                <span class="switch" aria-hidden="true"></span>
              </label>
            </div>
            <div class="custom-note">
              <label>
                Detalhes para o chef
                <textarea name="notes"></textarea>
              </label>
            </div>
          </section>
          <label id="preferencesField">
            Prefer&ecirc;ncias
            <textarea name="preferences"></textarea>
          </label>
          <label class="forbidden-card">
            Alimentos proibidos
            <textarea name="restrictions"></textarea>
          </label>
          <button class="primary full" type="button" id="savePetProfile">Salvar perfil</button>
        </form>
      </section>
    </main>
    <script src="./bistropet-storage.js"></script>
    <script>
      const petProfileForm = document.getElementById("petProfileForm");
      const savePetProfileButton = document.getElementById("savePetProfile");
      const preferencesField = document.getElementById("preferencesField");
      const freeProfile = document.getElementById("freeProfile");
      const customProfile = document.getElementById("customProfile");
      const isEditingProfile = new URLSearchParams(window.location.search).get("edit") === "1";

      function normalize(value) {
        return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
      }

      function extractKnownIngredients(value) {
        const text = normalize(value);
        const knownFoods = [
          { ingredient: "batata doce", aliases: ["batata doce"] },
          { ingredient: "abóbora", aliases: ["abobora", "abóbora"] },
          { ingredient: "cenoura", aliases: ["cenoura"] },
          { ingredient: "chuchu", aliases: ["chuchu"] },
          { ingredient: "frango", aliases: ["frango"] },
          { ingredient: "arroz", aliases: ["arroz"] },
          { ingredient: "peixe", aliases: ["peixe"] },
          { ingredient: "ovo", aliases: ["ovo", "ovos"] },
          { ingredient: "quinoa", aliases: ["quinoa"] },
          { ingredient: "abobrinha", aliases: ["abobrinha"] },
          { ingredient: "patinho", aliases: ["patinho"] },
          { ingredient: "mandioquinha", aliases: ["mandioquinha"] }
        ];

        return knownFoods
          .filter(food => food.aliases.some(alias => text.includes(normalize(alias))))
          .map(food => food.ingredient);
      }

      function splitBlockedFoods(value) {
        const clean = String(value || "").trim().replace(/\s+/g, " ");
        if (!clean) return [];
        if (/[,.;\n]/.test(clean)) return clean.split(/[,.;\n]/).map(item => item.trim()).filter(Boolean);
        const known = extractKnownIngredients(clean);
        return known.length ? known : [clean];
      }

      function syncProfileModeFields() {
        preferencesField.hidden = customProfile.checked;
      }

      function clearNewProfileData() {
        window.localStorage.removeItem("bistropet:pet-profile");
        window.localStorage.removeItem("bistropet:global-blocked-ingredients");
        window.sessionStorage.removeItem("bistropet:session3:free");
        window.sessionStorage.removeItem("bistropet:session3:special");
        window.sessionStorage.removeItem("bistropet:session3:blocked");
        [...petProfileForm.elements].forEach(field => {
          if (field.matches && field.matches("input:not([type='radio']), textarea")) field.value = "";
        });
        freeProfile.checked = true;
        syncProfileModeFields();
      }

      function fillPetProfileForm() {
        if (!isEditingProfile) {
          clearNewProfileData();
          return;
        }
        const profile = window.BistroPetStorage.getPetProfile();
        Object.entries(profile).forEach(([key, value]) => {
          const field = petProfileForm.elements[key];
          if (field) field.value = value;
        });
        document.getElementById(profile.menuStyle === "personalizada" ? "customProfile" : "freeProfile").checked = true;
        syncProfileModeFields();
      }

      function collectPetProfileForm() {
        const data = new FormData(petProfileForm);
        return {
          name: String(data.get("name") || "").trim(),
          tutor: String(data.get("tutor") || "").trim(),
          size: String(data.get("size") || "").trim(),
          age: String(data.get("age") || "").trim(),
          weight: String(data.get("weight") || "").trim(),
          menuStyle: customProfile.checked ? "personalizada" : "livre",
          preferences: customProfile.checked ? "" : String(data.get("preferences") || "").trim(),
          restrictions: String(data.get("restrictions") || "").trim(),
          notes: String(data.get("notes") || "").trim()
        };
      }

      function savePetProfile() {
        const profile = collectPetProfileForm();
        window.BistroPetStorage.savePetProfile(profile);
        if (window.BistroPetStorage.saveGlobalBlockedIngredients) {
          window.BistroPetStorage.saveGlobalBlockedIngredients(
            splitBlockedFoods(profile.restrictions)
          );
        }
      }

      function continueToRecipe() {
        savePetProfile();
        window.location.href = "./session-3-meal.html";
      }

      [freeProfile, customProfile].forEach(input => {
        input.addEventListener("change", () => {
          syncProfileModeFields();
          savePetProfile();
        });
      });
      const focusOrder = ["name", "tutor", "age", "weight", "size"];
      focusOrder.forEach((name, index) => {
        const field = petProfileForm.elements[name];
        field.addEventListener("keydown", event => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          const nextField = petProfileForm.elements[focusOrder[index + 1]];
          if (nextField) nextField.focus();
        });
      });
      petProfileForm.addEventListener("input", savePetProfile);
      savePetProfileButton.addEventListener("click", continueToRecipe);
      fillPetProfileForm();
    </script>
  </body>
</html>
