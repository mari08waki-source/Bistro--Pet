<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bistro Pet - QA</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f7f4ec;
        color: #2e332b;
        padding: 24px;
      }

      .qa-shell {
        max-width: 1040px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }

      .qa-bar,
      .qa-panel {
        border: 1px solid rgba(46, 51, 43, 0.14);
        background: rgba(255, 253, 248, 0.84);
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 14px 34px rgba(57, 67, 51, 0.08);
      }

      .qa-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
        font-weight: 500;
      }

      .qa-links,
      .qa-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      a,
      button {
        border: 1px solid rgba(46, 51, 43, 0.16);
        border-radius: 999px;
        background: #fffdf8;
        color: #2e332b;
        padding: 9px 12px;
        text-decoration: none;
        font: inherit;
        cursor: pointer;
      }

      button.primary {
        background: #879b82;
        color: #fffdf8;
      }

      button.danger {
        color: #7d362f;
      }

      .qa-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 14px;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: #556a54;
      }

      pre {
        min-height: 220px;
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px/1.5 Consolas, "Courier New", monospace;
        color: #3f453b;
      }

      .qa-note {
        margin: 0;
        color: #75796d;
        font-size: 13px;
      }

      @media (max-width: 820px) {
        body { padding: 14px; }
        .qa-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="qa-shell">
      <section class="qa-bar">
        <div>
          <h1>Bistro Pet QA</h1>
          <p class="qa-note">Painel temporário para testar navegação, persistência e restrições.</p>
        </div>
        <nav class="qa-links" aria-label="Telas do fluxo">
          <a href="./index.html">Onboarding</a>
          <a href="./session-2-pet-profile.html">Perfil</a>
          <a href="./session-3-meal.html">Receita</a>
          <a href="./session-4-weekly-plan.html">Plano semanal</a>
        </nav>
      </section>

      <section class="qa-bar">
        <div class="qa-actions" aria-label="Ações de teste">
          <button type="button" class="primary" id="generateRecipe">Gerar receita novamente</button>
          <button type="button" class="primary" id="generatePlan">Gerar novo plano semanal</button>
          <button type="button" class="danger" id="clearStorage">Limpar localStorage</button>
        </div>
        <button type="button" id="refreshStatus">Atualizar status</button>
      </section>

      <section class="qa-grid" aria-label="Estado salvo">
        <article class="qa-panel">
          <h2>Perfil salvo</h2>
          <pre id="profileStatus"></pre>
        </article>
        <article class="qa-panel">
          <h2>Última receita</h2>
          <pre id="recipeStatus"></pre>
        </article>
        <article class="qa-panel">
          <h2>Plano semanal</h2>
          <pre id="planStatus"></pre>
        </article>
      </section>
    </main>
    <script src="./bistropet-storage.js"></script>
    <script>
      const ingredients = ["Frango", "Arroz", "Abóbora", "Peixe", "Batata doce", "Cenoura", "Ovos", "Quinoa", "Chuchu"];
      const days = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"];

      function normalize(value) {
        return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      }

      function splitList(value) {
        return String(value || "").split(/[,.;\n]/).map(item => item.trim()).filter(Boolean);
      }

      function safeIngredients(profile) {
        const restrictions = window.BistroPetStorage.getOfficialRestrictions();
        const source = [...ingredients];
        return source.filter((item, index, list) => {
          const cleanItem = normalize(item);
          const blocked = restrictions.some(restriction => cleanItem.includes(normalize(restriction)));
          const repeated = list.findIndex(candidate => normalize(candidate) === cleanItem) !== index;
          return !blocked && !repeated;
        });
      }

      function generateRecipe() {
        const profile = window.BistroPetStorage.getPetProfile();
        const safe = safeIngredients(profile);
        const recipe = {
          title: `QA Bowl de ${(safe[0] || "arroz").toLowerCase()} com ${(safe[1] || "abóbora").toLowerCase()}`,
          description: `Receita de teste para ${profile.name || "seu pet"}, considerando porte ${profile.size}, ${profile.age}, ${profile.weight} e observações: ${profile.notes}.`,
          ingredients: safe.slice(0, 3),
          steps: [
            "Cozinhar os ingredientes separadamente.",
            "Misturar em textura delicada.",
            "Servir morno e observar a aceitação."
          ],
          observation: `Observações respeitadas: ${profile.notes || "nenhuma informada"}.`,
          image: "./session-3-meal-hero.png"
        };
        window.BistroPetStorage.saveLastRecipe(recipe);
        renderStatus();
      }

      function generatePlan() {
        const profile = window.BistroPetStorage.getPetProfile();
        const safe = safeIngredients(profile);
        const plan = days.map((day, index) => ({
          day,
          planMode: "auto",
          planModeLabel: "Automático",
          title: `QA ${day}: ${(safe[index % safe.length] || "arroz").toLowerCase()} com ${(safe[(index + 2) % safe.length] || "abóbora").toLowerCase()}`,
          image: index % 2 === 0 ? "./session-3-meal-hero.png" : "./session-3-meal-alt.png",
          profile: {
            name: profile.name,
            size: profile.size,
            age: profile.age,
            weight: profile.weight,
            notes: profile.notes
          }
        }));
        window.BistroPetStorage.saveWeeklyPlan(plan);
        renderStatus();
      }

      function clearStorage() {
        window.localStorage.removeItem("bistropet:pet-profile");
        window.localStorage.removeItem("bistropet:last-recipe");
        window.localStorage.removeItem("bistropet:weekly-plan");
        window.localStorage.removeItem("bistropet:recipe-index");
        renderStatus();
      }

      function format(value) {
        return value ? JSON.stringify(value, null, 2) : "Nada salvo ainda.";
      }

      function renderStatus() {
        document.getElementById("profileStatus").textContent = format(window.BistroPetStorage.getPetProfile());
        document.getElementById("recipeStatus").textContent = format(window.BistroPetStorage.getLastRecipe());
        document.getElementById("planStatus").textContent = format(window.BistroPetStorage.getWeeklyPlan());
      }

      document.getElementById("generateRecipe").addEventListener("click", generateRecipe);
      document.getElementById("generatePlan").addEventListener("click", generatePlan);
      document.getElementById("clearStorage").addEventListener("click", clearStorage);
      document.getElementById("refreshStatus").addEventListener("click", renderStatus);
      renderStatus();
    </script>
  </body>
</html>
