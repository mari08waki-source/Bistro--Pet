<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#556a54" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BistrôPet" />
    <title>Bistro Pet - Perfil do Pet</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/bistropet-apple-180.png" />
    <link rel="stylesheet" href="./styles.css?v=session2-profile" />
  </head>
  <body class="session-two-body">
    <main class="profile-session">
      <section class="profile-hero">
        <img src="./session-2-pet-profile-hero.png" alt="Cuidado premium e afetivo com pet em rotina elegante" />
        <div class="profile-hero-shade"></div>
        <div class="profile-hero-copy">
          <div class="brand-button profile-brand">
            Bistro Pet
            <span>perfil do pet</span>
          </div>
          <p>Um cuidado mais &iacute;ntimo come&ccedil;a conhecendo os pequenos detalhes.</p>
        </div>
      </section>

      <section class="profile-content">
        <div class="profile-title">
          <span>Perfil afetivo</span>
          <h1>Conhecer para cuidar melhor.</h1>
        </div>

        <form class="pet-profile-card" id="petProfileForm">
          <label>
            Nome do tutor
            <input name="tutor" />
          </label>
          <label>
            Nome do pet
            <input name="name" />
          </label>
          <div class="field-row">
            <label>
              Idade
              <input name="age" />
            </label>
            <label>
              Peso
              <input name="weight" />
            </label>
          </div>
          <label>
            Porte
            <input name="size" />
          </label>
	          <section class="menu-style" aria-label="Estilo do card&aacute;pio">
	            <span class="menu-style-title">Estilo do card&aacute;pio</span>
	            <input class="mode-radio" type="checkbox" name="menu-style" id="customProfile" />
	            <div class="mode-options">
	              <label class="mode-option" for="customProfile">
	                <span>
	                  <strong>Perfil Personalizado</strong>
                  <small>Ligue se o seu pet tiver alguma restri&ccedil;&atilde;o alimentar, alergia ou recomenda&ccedil;&atilde;o veterin&aacute;ria.</small>
                </span>
                <span class="switch" aria-hidden="true"></span>
              </label>
            </div>
            <div class="custom-note" id="observationCard" hidden>
              <label>
                Observa&ccedil;&atilde;o
                <textarea name="notes" placeholder="Ex.: alergia, orienta&ccedil;&atilde;o veterin&aacute;ria ou restri&ccedil;&atilde;o."></textarea>
              </label>
            </div>
          </section>
          <button class="primary full" type="button" id="savePetProfile">Salvar perfil</button>
        </form>
      </section>
    </main>
	    <script src="./bistropet-storage.js?v=clean-profile-state"></script>
	    <script src="./bistropet-accessibility.js"></script>
    <script>
      const petProfileForm = document.getElementById("petProfileForm");
	      const savePetProfileButton = document.getElementById("savePetProfile");
	      const observationCard = document.getElementById("observationCard");
	      const observationField = petProfileForm.elements.notes;
	      const customProfile = document.getElementById("customProfile");
      const isEditingProfile = new URLSearchParams(window.location.search).get("edit") === "1";
      const observationFoodWords = [
        "mandioquinha", "beterraba", "abobrinha", "mandioca", "cenoura", "batata", "frango",
        "chuchu", "carne", "peixe", "tilapia", "salmao", "arroz", "milho", "inhame",
        "pepino", "vagem", "couve", "selga", "quinoa", "aveia", "abobora", "peru", "ovo"
      ];

      function splitJoinedFoodWord(value) {
        const clean = String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        if (!clean || !/^[a-z]+$/.test(clean)) return "";
        const parts = [];
        let remaining = clean;
        while (remaining) {
          const match = observationFoodWords.find(item => remaining.startsWith(item));
          if (!match) return "";
          parts.push(match);
          remaining = remaining.slice(match.length);
        }
        return parts.length > 1 ? parts.join("\n") : "";
      }

      function normalizeObservationSeparators(value) {
        return String(value || "")
          .replace(/[\u200B-\u200D\u2060\uFEFF]+/g, "\n")
          .replace(/\u00A0/g, " ")
          .replace(/\s*[,;]\s*/g, "\n")
          .replace(/\n[ \t]+|[ \t]+\n/g, "\n")
          .replace(/\n{2,}/g, "\n")
          .split("\n")
          .map(item => splitJoinedFoodWord(item.trim()) || item)
          .join("\n");
      }

      function syncProfileModeFields() {
        observationCard.hidden = !customProfile.checked;
        if (!customProfile.checked) observationField.value = "";
      }

      function clearNewProfileData() {
        window.localStorage.removeItem("bistropet:pet-profile");
        window.localStorage.removeItem("bistropet:last-recipe");
        window.localStorage.removeItem("bistropet:manual-recipe-history");
        window.localStorage.removeItem("bistropet:weekly-plan");
        window.localStorage.removeItem("bistropet:global-blocked-ingredients");
        window.sessionStorage.removeItem("bistropet:session3:free");
        window.sessionStorage.removeItem("bistropet:session3:special");
        window.sessionStorage.removeItem("bistropet:session3:blocked");
        window.sessionStorage.removeItem("bistropet:session3:index");
        [...petProfileForm.elements].forEach(field => {
          if (field.matches && field.matches("input:not([type='radio']), textarea")) field.value = "";
        });
	        customProfile.checked = false;
	        syncProfileModeFields();
      }

      function fillPetProfileForm() {
        if (!isEditingProfile) {
          clearNewProfileData();
          return;
        }
        const profile = window.BistroPetStorage.getPetProfile();
        Object.entries(profile).forEach(([key, value]) => {
          const field = petProfileForm.elements[key];
          if (field) field.value = value;
        });
	        customProfile.checked = profile.menuStyle === "personalizada";
	        syncProfileModeFields();
      }

      function collectPetProfileForm() {
        const data = new FormData(petProfileForm);
        return {
          name: String(data.get("name") || "").trim(),
          tutor: String(data.get("tutor") || "").trim(),
          size: String(data.get("size") || "").trim(),
          age: String(data.get("age") || "").trim(),
          weight: String(data.get("weight") || "").trim(),
          menuStyle: customProfile.checked ? "personalizada" : "livre",
          notes: customProfile.checked ? normalizeObservationSeparators(data.get("notes")).trim() : ""
        };
      }

      function savePetProfile() {
        const savedProfile = window.BistroPetStorage.savePetProfile(collectPetProfileForm());
        observationField.value = savedProfile.notes || "";
      }

      function continueToRecipe() {
        savePetProfile();
        window.location.href = `./session-3-meal.html?v=visible-blocked-list-${Date.now()}`;
      }

	      customProfile.addEventListener("change", () => {
	        syncProfileModeFields();
	        savePetProfile();
	      });
      observationField.addEventListener("input", () => {
        const original = observationField.value;
        const normalized = normalizeObservationSeparators(original);
        if (normalized === original) return;
        const cursor = observationField.selectionStart;
        const normalizedCursor = normalizeObservationSeparators(original.slice(0, cursor)).length;
        observationField.value = normalized;
        observationField.setSelectionRange(normalizedCursor, normalizedCursor);
      });
      const autoAdvanceFields = [
        { name: "tutor", next: "name", minimumLength: 2 },
        { name: "name", next: "age", minimumLength: 2 },
        { name: "age", next: "weight", minimumLength: 1 },
	        { name: "weight", next: "size", minimumLength: 1 },
	        { name: "size", next: "customProfile", minimumLength: 3 }
      ];
      autoAdvanceFields.forEach(({ name, next, minimumLength }) => {
        const field = petProfileForm.elements[name];
        let advanceTimer;
        field.addEventListener("input", () => {
          window.clearTimeout(advanceTimer);
          if (field.value.trim().length < minimumLength) return;
          advanceTimer = window.setTimeout(() => {
            if (document.activeElement !== field) return;
            const nextField = petProfileForm.elements[next] || document.getElementById(next);
            if (nextField) nextField.focus();
          }, 700);
        });
      });
      petProfileForm.addEventListener("input", savePetProfile);
      savePetProfileButton.addEventListener("click", continueToRecipe);
      fillPetProfileForm();
    </script>
  </body>
</html>
